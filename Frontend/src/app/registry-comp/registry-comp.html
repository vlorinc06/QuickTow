<div class="registry-model-backdrop" (click)="closeModel()">
  <div class="registry-model-container" (click)="$event.stopPropagation()">
    <div *ngIf="selectedType === 'none'" class="registry-type-select">
      <h2>Regisztráció</h2>
      <p>Fiók típusának kiválasztása</p>

      <button type="button" (click)="registerAsUser()">Felhasználóként regisztrálok</button>
      <button type="button" (click)="registerAsTow()">Autómentőként regisztrálok</button>
    </div>

    <div *ngIf="selectedType === 'user'">
      <img src="assets/images/logo.png" alt="Logo" class="registry-logo">
      <button class="registry-back-btn" type="button" (click)="back()">← Vissza</button>

      <h2>Regisztráció</h2>

      <form (ngSubmit)="register()" class="registry-form">
        <div class="registry-row">
          <input type="text" placeholder="Vezetéknév" name="last_name" [(ngModel)]="last_name" required>
          <input type="text" placeholder="Keresztnév" name="first_name" [(ngModel)]="first_name" required>
        </div>

        <input type="text" placeholder="👤 Felhasználónév" name="username" [(ngModel)]="username" required>
        <input type="password" placeholder="🔒 Jelszó" name="password" [(ngModel)]="password" required>
        <input type="email" placeholder="📧 Email" name="email" [(ngModel)]="email" required>
        <input type="text" placeholder="📱 Telefonszám" name="phone_number" [(ngModel)]="phone_number" required>

        <button type="submit" class="primary-btn">
          Regisztrálás felhasználóként
        </button>
      </form>
    </div>

    <div *ngIf="selectedType === 'tow'">
      <img src="assets/images/logo.png" alt="Logo" class="registry-logo">
      <button class="registry-back-btn" type="button" (click)="back()">← Vissza</button>

      <h2>Regisztráció</h2>

      <form (ngSubmit)="register()" class="registry-form">
        <div class="registry-row">
          <input type="text" placeholder="Vezetéknév" name="last_name" [(ngModel)]="last_name" required>
          <input type="text" placeholder="Keresztnév" name="first_name" [(ngModel)]="first_name" required>
        </div>

        <input type="text" placeholder="👤 Felhasználónév" name="username" [(ngModel)]="username" required>
        <input type="password" placeholder="🔒 Jelszó" name="password" [(ngModel)]="password" required>
        <input type="email" placeholder="📧 Email" name="email" [(ngModel)]="email" required>
        <input type="text" placeholder="📱 Telefonszám" name="phone_number" [(ngModel)]="phone_number" required>
        <input type="number" placeholder="💵 Ár / km" name="priceperkm" [(ngModel)]="priceperkm" required>

        <button type="submit" class="primary-btn">
          Regisztrálás autómentőként
        </button>
      </form>
    </div>
  </div>
</div>

<!-- Saját üzenet popup -->
<div *ngIf="isMessageOpen" class="custom-alert-backdrop" (click)="closeMessage()">
  <div class="custom-alert-box" (click)="$event.stopPropagation()">
    <div class="custom-alert-icon" [ngClass]="messageType">
      <span *ngIf="messageType === 'success'">✓</span>
      <span *ngIf="messageType === 'error'">✕</span>
      <span *ngIf="messageType === 'warning'">!</span>
      <span *ngIf="messageType === 'info'">i</span>
    </div>

    <h3>{{ messageTitle }}</h3>
    <p>{{ messageText }}</p>

    <button type="button" class="custom-alert-btn" (click)="closeMessage()">
      Rendben
    </button>
  </div>
</div>
